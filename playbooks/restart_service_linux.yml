---
- name: Install apache
  become: true
  hosts: all
  gather_facts: true
  tasks:
    - name: Update all system packages
      apt:
        name: "*"
        state: latest

    - name: Install apache
      apt:
        name: apache2
        state: present

    - name: Restart apache service
      service:
        name: apache2
        state: restarted
        enabled: true    